[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agg-search"
version = "0.5.0"
description = "Multi-engine web search with RRF fusion, Jina reranking, query expansion and a tiered fetcher — CLI + MCP server, stdlib only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "TsukimioRinka" }]
keywords = ["search", "mcp", "rrf", "rerank", "agents", "rag"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.urls]
Homepage = "https://github.com/TsukimioRinka/agg-search"

[project.scripts]
agg-search = "agg_search.search:main"
crawl-fetch = "agg_search.fetch:main"
agg-search-eval = "agg_search.eval:main"
agg-search-mcp = "agg_search.mcp:main"
agg-search-http = "agg_search.http_transport:main"
agg-search-tune = "agg_search.learn:main"
agg-search-install = "agg_search.install:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agg_search = ["py.typed"]
