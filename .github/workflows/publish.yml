name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to commit SHAs: a moved tag must not become code
      # executed with this workflow's token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        # build tooling is hash-pinned and the backend is not fetched again
        # into an isolated env, so nothing unpinned runs with this token
        run: |
          python -m pip install --require-hashes --no-deps -r .github/requirements-build.txt
          python -m build --no-isolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # OIDC publishing only works once a matching trusted publisher exists on
    # PyPI for this repository and the `pypi` environment. Set the
    # PYPI_PUBLISH repository variable to "true" after configuring it;
    # until then the job is skipped instead of failing on every release.
    if: vars.PYPI_PUBLISH == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
